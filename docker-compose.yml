services:
  postgres:
    image: postgres:16-alpine
    container_name: jiuwenswarm-postgres
    restart: unless-stopped
    networks:
      - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.claw
    container_name: jiuwenswarm-app
    restart: unless-stopped
    # Only the primary app bridges all three segments: nginx's public traffic
    # (frontend), its own login/session store (db), and per-user backend
    # containers (users). Nothing else needs to - and nothing else should be
    # able to - reach either postgres or a user's backend directly, so a
    # vulnerability in nginx (or in this container, reached from nginx) can't
    # pivot straight to another user's isolated workspace.
    networks:
      - frontend
      - db
      - users
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Read directly by psycopg2 (libpq env vars) - no URL assembly/parsing,
      # so passwords with URL-unsafe characters (%, &, ...) just work.
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_HOST: 0.0.0.0
      # Main chat/LLM model (plain env vars, read via os.getenv - see
      # jiuwenswarm/common/config.py get_default_models()).
      API_KEY: ${API_KEY:-}
      API_BASE: ${API_BASE:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      # Director Mode video generation model (jiuwenswarm/agents/harness/common/tools/video_gen_tools.py).
      VIDEO_GEN_ENABLED: ${VIDEO_GEN_ENABLED:-false}
      VIDEO_GEN_PROVIDER: ${VIDEO_GEN_PROVIDER:-}
      VIDEO_GEN_PROTOCOL: ${VIDEO_GEN_PROTOCOL:-}
      VIDEO_GEN_API_BASE: ${VIDEO_GEN_API_BASE:-}
      VIDEO_GEN_API_KEY: ${VIDEO_GEN_API_KEY:-}
      VIDEO_GEN_MODEL_NAME: ${VIDEO_GEN_MODEL_NAME:-}
      # Director Mode image generation model (jiuwenswarm/agents/harness/common/tools/visual_gen_tools.py).
      VISUAL_GEN_ENABLED: ${VISUAL_GEN_ENABLED:-false}
      VISUAL_GEN_PROVIDER: ${VISUAL_GEN_PROVIDER:-}
      VISUAL_GEN_PROTOCOL: ${VISUAL_GEN_PROTOCOL:-}
      VISUAL_GEN_API_BASE: ${VISUAL_GEN_API_BASE:-}
      VISUAL_GEN_API_KEY: ${VISUAL_GEN_API_KEY:-}
      VISUAL_GEN_MODEL_NAME: ${VISUAL_GEN_MODEL_NAME:-}
      # Director Mode audio generation / TTS model (jiuwenswarm/agents/harness/common/tools/audio_gen_tools.py).
      AUDIO_GEN_ENABLED: ${AUDIO_GEN_ENABLED:-false}
      AUDIO_GEN_API_BASE: ${AUDIO_GEN_API_BASE:-}
      AUDIO_GEN_API_KEY: ${AUDIO_GEN_API_KEY:-}
      AUDIO_GEN_MODEL_NAME: ${AUDIO_GEN_MODEL_NAME:-}
    volumes:
      - app_workspace:/home/app/.jiuwenswarm
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    container_name: jiuwenswarm-nginx
    restart: unless-stopped
    networks:
      - frontend
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certbot-www:/var/www/certbot:ro
      - ./deploy/nginx/letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    container_name: jiuwenswarm-certbot
    restart: unless-stopped
    networks:
      - frontend
    volumes:
      - ./deploy/nginx/certbot-www:/var/www/certbot
      - ./deploy/nginx/letsencrypt:/etc/letsencrypt
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

networks:
  # nginx <-> app only. nginx can never reach postgres or any user backend.
  frontend:
  # app <-> postgres only. Nothing else (nginx, user backends) can reach
  # the credentials/session store.
  db:
  # app <-> every per-user backend container (jiuwenswarm-user-<username>,
  # joined here by deploy/provision_user.sh). nginx and postgres are not on
  # this network at all, so they cannot reach a user's backend even if
  # compromised. User backends still share this one network with each
  # other (not pairwise-isolated) - see deploy/architecture.md for the
  # reasoning and the residual-risk tradeoff this accepts.
  users:

volumes:
  pg_data:
  app_workspace:
