services:
  postgres:
    image: postgres:16-alpine
    container_name: jiuwenswarm-postgres
    restart: unless-stopped
    networks:
      - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.claw
    container_name: jiuwenswarm-app
    restart: unless-stopped
    # Every isolated user gets their OWN dedicated Docker network (created by
    # deploy/provision_user.sh, one per user - not declared here, since a
    # static per-user network list would mean editing this file and
    # redeploying for every new user). This service's declared networks are
    # just its two fixed roles: nginx's public traffic (frontend) and its own
    # login/session store (db). `app` also gets dynamically connected to each
    # user's network at provision time via `docker network connect` - that
    # works on an already-running container with no restart, but is NOT
    # tracked here, so IMPORTANT: after any redeploy/recreate of this service
    # (docker compose up -d --build app, or anything else that recreates it),
    # you MUST run deploy/reconnect_user_networks.sh afterward, or every
    # already-provisioned user's routing silently breaks until you do -
    # Compose only restores the networks declared below, not the imperative
    # per-user ones. See deploy/architecture.md.
    networks:
      - frontend
      - db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Read directly by psycopg2 (libpq env vars) - no URL assembly/parsing,
      # so passwords with URL-unsafe characters (%, &, ...) just work.
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_HOST: 0.0.0.0
      # Stable per-account identity used as the cloud-storage (Tencent COS)
      # object-key prefix - see get_local_user_id() in jiuwenswarm/common/utils.py.
      # Every isolated user's container gets its own via deploy/provision_user.sh.
      JIUWENSWARM_USER_ID: ${ADMIN_USERNAME}
      # Main chat/LLM model (plain env vars, read via os.getenv - see
      # jiuwenswarm/common/config.py get_default_models()).
      API_KEY: ${API_KEY:-}
      API_BASE: ${API_BASE:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      # Director Mode video generation model (jiuwenswarm/agents/harness/common/tools/video_gen_tools.py).
      VIDEO_GEN_ENABLED: ${VIDEO_GEN_ENABLED:-false}
      VIDEO_GEN_PROVIDER: ${VIDEO_GEN_PROVIDER:-}
      VIDEO_GEN_PROTOCOL: ${VIDEO_GEN_PROTOCOL:-}
      VIDEO_GEN_API_BASE: ${VIDEO_GEN_API_BASE:-}
      VIDEO_GEN_API_KEY: ${VIDEO_GEN_API_KEY:-}
      VIDEO_GEN_MODEL_NAME: ${VIDEO_GEN_MODEL_NAME:-}
      # Director Mode image generation model (jiuwenswarm/agents/harness/common/tools/visual_gen_tools.py).
      VISUAL_GEN_ENABLED: ${VISUAL_GEN_ENABLED:-false}
      VISUAL_GEN_PROVIDER: ${VISUAL_GEN_PROVIDER:-}
      VISUAL_GEN_PROTOCOL: ${VISUAL_GEN_PROTOCOL:-}
      VISUAL_GEN_API_BASE: ${VISUAL_GEN_API_BASE:-}
      VISUAL_GEN_API_KEY: ${VISUAL_GEN_API_KEY:-}
      VISUAL_GEN_MODEL_NAME: ${VISUAL_GEN_MODEL_NAME:-}
      # Director Mode audio generation / TTS model (jiuwenswarm/agents/harness/common/tools/audio_gen_tools.py).
      AUDIO_GEN_ENABLED: ${AUDIO_GEN_ENABLED:-false}
      AUDIO_GEN_API_BASE: ${AUDIO_GEN_API_BASE:-}
      AUDIO_GEN_API_KEY: ${AUDIO_GEN_API_KEY:-}
      AUDIO_GEN_MODEL_NAME: ${AUDIO_GEN_MODEL_NAME:-}
    volumes:
      - app_workspace:/home/app/.jiuwenswarm
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    container_name: jiuwenswarm-nginx
    restart: unless-stopped
    networks:
      - frontend
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certbot-www:/var/www/certbot:ro
      - ./deploy/nginx/letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    container_name: jiuwenswarm-certbot
    restart: unless-stopped
    networks:
      - frontend
    volumes:
      - ./deploy/nginx/certbot-www:/var/www/certbot
      - ./deploy/nginx/letsencrypt:/etc/letsencrypt
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

networks:
  # nginx <-> app only. nginx can never reach postgres or any user backend.
  frontend:
  # app <-> postgres only. Nothing else (nginx, user backends) can reach
  # the credentials/session store.
  db:
  # Per-user networks (jiuwenswarm_user_<username>_net, one per isolated
  # user) are created and attached imperatively by deploy/provision_user.sh,
  # not declared here - see the comment on the `app` service above and
  # deploy/architecture.md. Each one has exactly two members: `app` and that
  # one user's backend container, so user backends can never reach each
  # other, and nothing but `app` can ever reach any of them.

volumes:
  pg_data:
  app_workspace:
