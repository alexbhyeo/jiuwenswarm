# Bootstrap config: HTTP only, no auth gate. deploy/init-letsencrypt.sh
# overwrites this file with deploy/nginx/app-ssl.conf once a certificate has
# been issued - this one only exists to let the ACME HTTP-01 challenge (and
# nothing else) through before a cert exists.
server {
    listen 80;
    server_name workswarm.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
