# Final config: HTTPS with the Let's Encrypt cert, HTTP redirected to HTTPS.
# Installed over conf.d/app.conf by deploy/init-letsencrypt.sh after the
# certificate has been issued. Kept outside conf.d so nginx never loads both
# this and the bootstrap config at once.
#
# The entire login/session/logout gate lives here plus deploy/authgate/ -
# nothing in the jiuwenswarm repo itself knows about auth. "app" and every
# jiuwenswarm-user-<username> container are 100% unmodified upstream code;
# nginx decides per request, via one auth_request subrequest to authgate,
# whether to let it through and which backend to proxy it to. See
# deploy/architecture.md.
server {
    listen 80;
    server_name workswarm.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name workswarm.app;

    ssl_certificate     /etc/letsencrypt/live/workswarm.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workswarm.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker's embedded DNS - needed because proxy_pass below uses a
    # variable ($backend_host), which nginx only re-resolves at request time
    # (rather than once at startup) when a resolver is configured.
    resolver 127.0.0.11 valid=10s;

    # --- Auth endpoints: always reachable, never gated by auth_request. ---
    location = /login {
        proxy_pass http://authgate:8080/login;
        proxy_set_header Host $host;
    }

    location = /auth/login {
        proxy_pass http://authgate:8080/auth/login;
        proxy_set_header Host $host;
    }

    location = /auth/logout {
        proxy_pass http://authgate:8080/auth/logout;
        proxy_set_header Host $host;
    }

    # Internal-only subrequest target for auth_request below - never reachable
    # directly from outside (nginx enforces `internal`, independent of the
    # name matching /auth/*).
    location = /auth/verify {
        internal;
        proxy_pass http://authgate:8080/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # The injected logout button - a static file nginx serves directly, not
    # part of any jiuwenswarm build. Harmless if fetched directly (just a
    # small script), so it doesn't need to be gated either.
    location = /auth-overlay.js {
        alias /etc/nginx/static/auth-overlay.js;
        add_header Cache-Control "no-store";
    }

    location @login_redirect {
        return 302 /login?next=$request_uri;
    }

    # --- Everything else: gated. No path reaches a backend without a valid
    #     session - this is the only location block that proxies to app
    #     or to any jiuwenswarm-user-<username> container. ---
    location / {
        auth_request /auth/verify;
        auth_request_set $backend_host $upstream_http_x_backend_host;
        error_page 401 = @login_redirect;

        proxy_pass http://$backend_host:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;

        # sub_filter can't rewrite a gzipped response body, so ask the
        # (completely auth-unaware) backend not to compress this one.
        proxy_set_header Accept-Encoding "";
        sub_filter '</body>' '<script src="/auth-overlay.js"></script></body>';
        sub_filter_once on;
    }
}
