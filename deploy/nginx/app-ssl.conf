# Final config: HTTPS with the Let's Encrypt cert, HTTP redirected to HTTPS.
# Installed over conf.d/app.conf by deploy/init-letsencrypt.sh after the
# certificate has been issued. Kept outside conf.d so nginx never loads both
# this and the bootstrap config at once.
server {
    listen 80;
    server_name happypeaceland.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name happypeaceland.net;

    ssl_certificate     /etc/letsencrypt/live/happypeaceland.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/happypeaceland.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
